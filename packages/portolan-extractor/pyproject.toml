# BOUNDARY RULE (ARCHITECTURE §18.7, NFR-8.5a): this package MUST NOT depend
# on portolan-core. It is an API client speaking the batch contract (§18.2).
# Importing core would make it a second writer with database access and void
# single-writer custody (§18.4). It shares portolan-contract instead.

[project]
name = "portolan-extractor"
version = "0.0.0"
description = "Parse, normalize, extract relationship claims. Emits mentions, never node identifiers."
requires-python = ">=3.11"
# Third-party runtime dependencies are intentionally NOT declared yet
# (GUIDELINES §7: adding dependencies is out of scope without instruction).
# Add them as each capability is implemented.
dependencies = [
    "portolan-contract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portolan"]

[tool.uv.sources]
portolan-contract = { workspace = true }
