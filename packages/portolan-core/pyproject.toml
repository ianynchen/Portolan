[project]
name = "portolan-core"
version = "0.0.0"
description = "Core library: schema, migrations, operations, staging, promotion, resolution. Sole database custody."
requires-python = ">=3.11"
# Third-party runtime dependencies are intentionally NOT declared yet
# (GUIDELINES §7: adding dependencies is out of scope without instruction).
# Add them as each capability is implemented.
dependencies = [
    "portolan-contract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portolan"]

[tool.uv.sources]
portolan-contract = { workspace = true }
