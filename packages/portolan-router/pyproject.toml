[project]
name = "portolan-router"
version = "0.0.0"
description = "REST and MCP transport. Exports routers and a tool registry, never an application."
requires-python = ">=3.11"
# Third-party runtime dependencies are intentionally NOT declared yet
# (GUIDELINES §7: adding dependencies is out of scope without instruction).
# Add them as each capability is implemented.
dependencies = [
    "portolan-core",
    "portolan-contract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portolan"]

[tool.uv.sources]
portolan-core = { workspace = true }
portolan-contract = { workspace = true }
